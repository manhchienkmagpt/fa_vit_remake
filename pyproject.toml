[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "favit-reproduction"
version = "0.1.0"
description = "Paper-oriented FA-ViT reproduction for FF++ to Celeb-DF evaluation"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=1.0.0",
  "opencv-python>=4.8",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
preprocess = ["facenet-pytorch>=2.6"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["favit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

