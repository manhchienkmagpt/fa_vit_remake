[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "favit-m2tr"
version = "0.1.0"
description = "FA-ViT enhanced with M2TR multi-scale frequency fusion"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=1.0.0",
  "opencv-python>=4.8",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# facenet-pytorch 2.6 has obsolete upper pins on torch, Pillow, and NumPy.
# Install its pure-Python wheel separately with --no-deps as documented.
preprocess = ["requests>=2.31"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["favit_m2tr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
