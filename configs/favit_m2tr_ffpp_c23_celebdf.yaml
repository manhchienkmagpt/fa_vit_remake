seed: 42
device: cuda
output_dir: outputs/favit_m2tr_ffpp_c23

data:
  root: "E:\\Deepfake_Data_Chien\\ffpp_celebdf_data\\processed"
  train_pairs: "E:\\Deepfake_Data_Chien\\ffpp_celebdf_data\\processed\\manifests\\ffpp_c23_train_pairs.csv"
  celebdf_test_frames: "E:\\Deepfake_Data_Chien\\ffpp_celebdf_data\\processed\\manifests\\celebdf_test_frames.csv"
  image_size: 224
  num_workers: 4
  horizontal_flip: 0.0  # augmentation was not specified in the paper

model:
  backbone: vit_base_patch16_224.augreg_in21k
  pretrained: true
  num_classes: 2
  gam_reduction: 2
  inject_layers: [0, 3, 6]
  # Matches the authors' released implementation. The paper broadly describes
  # the pre-trained ViT blocks as frozen; see docs/REPRODUCTION_NOTES.md.
  train_backbone_norms: true
  train_cls_token: true
  image_size: 224
  # M2TR runs on FA-ViT's H/4 spatial map (56x56 at this resolution).
  m2tr_channels: 64
  m2tr_depth: 4
  m2tr_patch_sizes: [56, 28, 14, 7]
  m2tr_fusion_hidden_channels: 32
  # Pool only frequency K/V to bound CMF memory; RGB queries stay 56x56.
  m2tr_fusion_pool_size: 14
  m2tr_dropout: 0.0

loss:
  fal_margin: 0.25
  fal_scale: 24.0
  fal_weight_after_warmup: 1.0
  fal_warmup_epochs: 1

train:
  epochs: 30  # not reported by the paper; explicit reproduction default
  # The four M2TR stages add activation memory. Increase after measuring VRAM.
  image_batch_size: 16  # 8 fake-real pairs = 16 images
  learning_rate: 0.00003
  weight_decay: 0.00001
  lr_step_size: 5
  lr_gamma: 0.5
  amp: true
  # Set this to outputs/favit_m2tr_ffpp_c23/last.pt, or pass --resume on the CLI,
  # to continue from a previous run.
  resume: null
